<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Smart Hydro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="welcome-body auth-mobile-body">
    <div class="welcome-glow welcome-glow-left" aria-hidden="true"></div>
    <div class="welcome-glow welcome-glow-right" aria-hidden="true"></div>

    <main class="auth-mobile-shell">
      <div class="auth-mobile-frame" aria-label="Smart Hydro mobile sign up">
        <div class="auth-mobile-notch" aria-hidden="true"></div>
        <section class="auth-mobile-screen">
          <header class="auth-mobile-header">
            <a class="welcome-brand" href="welcome.html" aria-label="Smart Hydro home">
              <span class="welcome-brand-icon" aria-hidden="true">🌿</span>
              <strong>Smart Hydro</strong>
            </a>
            <a class="welcome-chip" href="welcome.html">Back</a>
          </header>

          <div class="auth-mobile-content">
            <span class="welcome-badge">Create account</span>
            <h1>Sign up</h1>
            <p class="auth-mobile-lead">
              Register today to get real-time sensor updates, smart alerts, and simple care tips for
              your hydroponic system.
            </p>

            <form class="auth-form auth-form-mobile" id="sign-up-form">
              <label for="email">
                Email
                <input id="email" name="email" type="email" autocomplete="email" required />
              </label>

              <label for="password">
                Password
                <input id="password" name="password" type="password" autocomplete="new-password" required />
              </label>

              <label for="confirm-password">
                Confirm password
                <input
                  id="confirm-password"
                  name="confirm-password"
                  type="password"
                  autocomplete="new-password"
                  required
                />
              </label>

              <button class="welcome-cta auth-submit" id="sign-up-submit" type="submit">
                Create account
                <span aria-hidden="true">›</span>
              </button>

              <p class="auth-message" id="auth-message" aria-live="polite"></p>
            </form>

            <p class="auth-switch auth-switch-mobile">
              Already have an account?
              <a href="sign-in.html">Sign in</a>
            </p>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.SMART_HYDRO_SUPABASE = window.SMART_HYDRO_SUPABASE || {};
    </script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="sign-up.js"></script>
  </body>
</html>
